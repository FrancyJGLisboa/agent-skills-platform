name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --target-version py310"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run test suite
        run: uv run --with pytest pytest scripts/tests/ -q

      - name: Require current verification evidence for changed skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          python3 scripts/check_verification.py --base "$BASE_SHA"

      - name: Validate bundled example skills
        run: |
          for skill in references/examples/*/; do
            if [ -f "$skill/SKILL.md" ]; then
              echo "::group::$skill"
              python3 scripts/skill_graph.py run "$skill" --jobs 4 --cache "/tmp/$(basename "$skill")-gate-cache.json"
              echo "::endgroup::"
            fi
          done

      - name: Validate and roll out bundled eval specs
        run: |
          for runner in references/examples/*/scripts/run_evals.py; do
            [ -f "$runner" ] || continue
            skill_dir="$(dirname "$(dirname "$runner")")"
            echo "::group::eval $skill_dir"
            python3 "$runner" "$skill_dir" --validate
            # CI is release scoring: holdout (split=test) cases are included here
            # and only here — never in an optimization loop.
            python3 "$runner" "$skill_dir" --rollout --include-holdout
            # The shipped self-maintenance loop must run green end-to-end.
            # Pin last_reviewed to today in this disposable checkout first:
            # this step tests the machinery, and must not go red on the fixed
            # calendar day the bundled example crosses its review interval.
            sed -i.bak "s/^  last_reviewed: .*/  last_reviewed: $(date +%F)/" "$skill_dir/SKILL.md"
            rm -f "$skill_dir/SKILL.md.bak"
            (cd "$skill_dir" && python3 scripts/evolve.py)
            echo "::endgroup::"
          done

      - name: Validate Caliper agent-run specs (syntax only, no agent, no keys)
        # `caliper validate` is offline. Agent runs stay local; see docs/CALIPER.md.
        run: |
          for spec in references/examples/*/evals/caliper/*.eval.yaml; do
            [ -f "$spec" ] || continue
            uvx --from caliper-eval==0.11.0 caliper validate "$spec"
          done

  cross-os:
    # The project's promise is cross-platform install; run the suite on the
    # other POSIX/Windows targets to catch path- and OS-specific bugs.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pytest_args: "scripts/tests/ -q"
          - os: windows-latest
            # test_run_evals exercises the eval runner's command-checks, which
            # use a POSIX shell (test/grep via shell=True) and don't run under
            # cmd.exe. Everything else (path handling, parsing, export) is
            # portable and does run on Windows.
            pytest_args: "scripts/tests/ -q --ignore=scripts/tests/test_run_evals.py"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Run test suite
        run: uv run --with pytest pytest ${{ matrix.pytest_args }}

  powershell:
    # Syntax-check the Windows installers so a broken .ps1 cannot ship
    # unnoticed (the headline claim includes Windows tools).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse-check PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($_.FullName)::PowerShell parse errors"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK: $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }
